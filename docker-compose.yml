version: "3.8"

services:
  smart-energy-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-energy-forecasting:latest
    container_name: smart_energy_forecast_app
    ports:
      - "8501:8501"
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      # Optional: persist newly downloaded SMARD data across container restarts
      - ./data/processed:/app/data/processed
      - ./data/raw:/app/data/raw
